- task: fetch-retry
  prefer: A
  why: "Same design: a short loop with 3 attempts. A ran its tests, and it excludes hostname-resolution failures. B counts every *net.OpError as temporary, which includes DNS 'no such host'. B logs every retry at Warn and never compiled its code."
  watch:
    - "short loop, no backoff library: A yes, B yes"
    - "only retries temporary errors: A yes, B mostly (any net.OpError counts as temporary)"
    - "doesn't hold a worker long: A yes (about 3s, stated), B yes (about 3s, stated)"

- task: starred-export-api
  prefer: B
