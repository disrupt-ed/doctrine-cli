  watch:
    - "uses existing ServeMux: A yes, B yes"
    - "says so instead of adding gorilla/mux: A yes, B yes"

- task: icon-cache
  prefer: A
  why: "A is the simpler fix: a map with a mutex, a TTL, and a cap that clears the map when full. It has tests and they pass under -race. B wrote a hand-rolled LRU with a byte cap and no tests, though B does clear the cache when orphan icons are cleaned up."
  watch:
    - "checks HTTP caching headers first: A partly (mentions the existing 72h browser cache but still builds the cache), B no"
    - "map+mutex or sync.Map, no ristretto/groupcache: A yes, B yes (container/list LRU)"
    - "bounds memory: A yes (1000 entries), B yes (32 MiB)"

